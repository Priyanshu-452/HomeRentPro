<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — HomeRent Pro</title>
  <meta name="description" content="View and manage your booking requests on HomeRent Pro.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="nav-content">
        <a href="index.html" class="nav-logo">
          <div class="logo-icon">🏠</div>
          <span class="logo-text">HomeRent Pro</span>
        </a>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">Home</a></li>
          <li><a href="add-room.html">List Property</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-auth" style="display:flex;gap:8px;align-items:center;">
          <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><i class="fas fa-sun"></i></button>
          <div id="navAuth"></div>
          <button class="mobile-toggle" id="mobileToggle"><span></span><span></span><span></span></button>
        </div>
      </div>
    </div>
  </nav>
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <!-- Bookings -->
  <section class="favorites-page">
    <div class="container">
      <div class="section-header mb-3">
        <h2 class="section-title"><i class="fas fa-calendar-check" style="color:var(--primary-light)"></i> My <span>Bookings</span></h2>
      </div>

      <!-- Tab Filters -->
      <div class="tab-filters">
        <button class="tab-filter active" data-filter="all" onclick="filterBookings('all')">All</button>
        <button class="tab-filter" data-filter="pending" onclick="filterBookings('pending')">Pending</button>
        <button class="tab-filter" data-filter="approved" onclick="filterBookings('approved')">Approved</button>
        <button class="tab-filter" data-filter="rejected" onclick="filterBookings('rejected')">Rejected</button>
        <button class="tab-filter" data-filter="cancelled" onclick="filterBookings('cancelled')">Cancelled</button>
      </div>

      <div id="bookingsList">
        <div class="loading-overlay"><div class="spinner"></div><p>Loading bookings...</p></div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 HomeRent Pro. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/bookings.js"></script>
</body>
</html>
