<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — HomeRent Pro</title>
  <meta name="description" content="Manage your HomeRent Pro profile, update details, and change your password.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <div class="nav-content">
        <a href="index.html" class="nav-logo">
          <div class="logo-icon">🏠</div>
          <span class="logo-text">HomeRent Pro</span>
        </a>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">Home</a></li>
          <li><a href="add-room.html">List Property</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-auth" style="display:flex;gap:8px;align-items:center;">
          <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><i class="fas fa-sun"></i></button>
          <div id="navAuth"></div>
          <button class="mobile-toggle" id="mobileToggle"><span></span><span></span><span></span></button>
        </div>
      </div>
    </div>
  </nav>
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <!-- Profile -->
  <section class="profile-page">
    <div class="container">
      <div class="profile-card">
        <!-- Header -->
        <div class="profile-header">
          <div class="profile-avatar" id="profileAvatar">?</div>
          <div class="profile-header-info">
            <h2 id="profileName">Loading...</h2>
            <p id="profileEmail" class="text-muted"></p>
            <p id="profileRole" style="font-size:0.85rem;margin-top:4px"></p>
            <p id="profileJoined" style="font-size:0.8rem;color:var(--text-muted);margin-top:2px"></p>
          </div>
        </div>

        <!-- Edit Profile -->
        <div class="profile-section">
          <h3><i class="fas fa-user-edit" style="color:var(--primary-light)"></i> Edit Profile</h3>
          <form id="profileForm">
            <div class="form-group">
              <label for="editName">Full Name</label>
              <input type="text" id="editName" required>
            </div>
            <div class="form-group">
              <label for="editPhone">Phone Number</label>
              <input type="tel" id="editPhone" placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
              <label for="editBio">Bio</label>
              <textarea id="editBio" rows="3" placeholder="Tell us about yourself..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
          </form>
        </div>

        <!-- Change Password -->
        <div class="profile-section">
          <h3><i class="fas fa-lock" style="color:var(--warning)"></i> Change Password</h3>
          <form id="passwordForm">
            <div class="form-group">
              <label for="currentPassword">Current Password</label>
              <input type="password" id="currentPassword" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="6">
              </div>
              <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" required>
              </div>
            </div>
            <button type="submit" class="btn btn-secondary"><i class="fas fa-key"></i> Change Password</button>
          </form>
        </div>

        <!-- Danger Zone -->
        <div class="profile-section">
          <h3><i class="fas fa-exclamation-triangle" style="color:var(--danger)"></i> Account</h3>
          <button class="btn btn-danger" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 HomeRent Pro. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
